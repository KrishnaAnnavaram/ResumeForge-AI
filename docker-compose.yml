version: "3.9"

# ── ResumeForge AI — Docker Compose (development + production) ────────────────
#
# Usage (development):
#   docker compose up --build
#
# Usage (production):
#   ENVIRONMENT=production docker compose up -d --build
#
# Prerequisites: create a .env file from .env.example before running.

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resumeforge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      # Hot-reload in development
      - ./backend:/app/backend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app_net

  # ── React Frontend (Vite dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: resumeforge_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
