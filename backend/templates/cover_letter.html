<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter — {{full_name}}</title>
<style>
  @page {
    size: A4;
    margin: 25mm 20mm 25mm 20mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #1a1a1a;
  }

  .sender-info {
    margin-bottom: 28px;
  }
  .sender-info .name {
    font-size: 14pt;
    font-weight: 700;
  }
  .sender-info .contact {
    font-size: 10pt;
    color: #555;
    margin-top: 3px;
  }

  .date-line {
    margin-bottom: 20px;
    font-size: 10.5pt;
    color: #555;
  }

  .recipient {
    margin-bottom: 24px;
    font-size: 10.5pt;
  }

  .salutation {
    margin-bottom: 16px;
    font-weight: 600;
  }

  .body p {
    margin-bottom: 14px;
    text-align: justify;
  }

  .closing {
    margin-top: 28px;
    font-weight: 600;
  }
  .signature {
    margin-top: 36px;
    font-weight: 700;
    font-size: 12pt;
  }

  /* Soft skill highlights */
  mark { background: #E1F5EE; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>

<div class="sender-info">
  <div class="name">{{full_name}}</div>
  <div class="contact">{{email}}</div>
</div>

<div class="date-line">{{date}}</div>

<div class="recipient">
  Hiring Manager<br>
  {{company}}
</div>

<div class="salutation">Dear Hiring Manager,</div>

<div class="body">
  {{cover_body}}
</div>

<div class="closing">Sincerely,</div>
<div class="signature">{{full_name}}</div>

</body>
</html>
